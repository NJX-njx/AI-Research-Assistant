name: demo_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - openai>=1.3.0
      - langchain>=0.2.12
      - langchain-openai>=0.1.0
      - networkx>=3.2
      - pydantic>=2.6
      - pdfminer.six>=20231228
